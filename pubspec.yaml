name: feedback_app
description: "A modern, production-ready Student & Company Feedback Platform built with Flutter and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  google_sign_in: ^6.2.1

  # Architecture & State Management
  provider: ^6.1.2
  go_router: ^14.0.0

  # UI, Charts & Styling
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Utilities & Media
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
